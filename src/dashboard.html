<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DSH Workers</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #090b10;
      --panel: #11151d;
      --panel-2: #151a24;
      --border: #262d3d;
      --text: #e7eaf0;
      --muted: #8b94a8;
      --faint: #5e687c;
      --accent: #8ea6ff;
      --accent-2: #54d6bd;
      --warn: #f7c96b;
      --error: #ff7d8c;
      --ok: #66d99b;
      --mono: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
      --sans: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    * { box-sizing: border-box; }
    .empty[hidden], .job-view[hidden] { display: none; }
    html, body { height: 100%; }
    body {
      margin: 0;
      background: radial-gradient(circle at 78% -15%, #1a2240 0, transparent 38%), var(--bg);
      color: var(--text);
      font-family: var(--sans);
      font-size: 14px;
      overflow: hidden;
    }
    button, input { font: inherit; }
    .app { display: flex; flex-direction: column; height: 100vh; }
    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      min-height: 68px;
      padding: 12px 22px;
      border-bottom: 1px solid var(--border);
      background: color-mix(in srgb, var(--bg) 82%, transparent);
      backdrop-filter: blur(14px);
    }
    .brand { display: flex; align-items: center; gap: 12px; min-width: 0; }
    .brand-mark {
      display: grid;
      place-items: center;
      width: 38px;
      height: 38px;
      border-radius: 11px;
      color: #0a0d14;
      background: linear-gradient(135deg, var(--accent-2), var(--accent));
      font-weight: 800;
      letter-spacing: -0.06em;
    }
    .brand h1 { margin: 0; font-size: 17px; font-weight: 700; letter-spacing: -0.02em; }
    .brand p { margin: 2px 0 0; color: var(--muted); font-size: 12px; }
    .live {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      flex: 0 0 auto;
      padding: 7px 11px;
      border: 1px solid var(--border);
      border-radius: 999px;
      color: var(--muted);
      background: rgba(255,255,255,.025);
      font-size: 12px;
    }
    .live-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--faint); }
    .live.online { color: var(--ok); border-color: color-mix(in srgb, var(--ok) 32%, var(--border)); }
    .live.online .live-dot { background: var(--ok); box-shadow: 0 0 10px var(--ok); }
    .live.offline { color: var(--error); }
    .live.offline .live-dot { background: var(--error); }
    .layout { display: grid; grid-template-columns: 310px minmax(0, 1fr); min-height: 0; flex: 1; }
    .sidebar {
      display: flex;
      flex-direction: column;
      min-height: 0;
      border-right: 1px solid var(--border);
      background: color-mix(in srgb, var(--panel) 84%, transparent);
    }
    .sidebar-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 16px 16px 11px;
    }
    .sidebar-head h2 { margin: 0; font-size: 12px; text-transform: uppercase; letter-spacing: .12em; color: var(--muted); }
    .counts { display: flex; gap: 6px; }
    .count {
      min-width: 26px;
      padding: 3px 7px;
      border-radius: 7px;
      background: var(--panel-2);
      color: var(--muted);
      text-align: center;
      font: 11px var(--mono);
    }
    .count strong { color: var(--text); font-weight: 600; }
    .sidebar-note { padding: 0 16px 11px; color: var(--faint); font: 10px var(--mono); }
    .job-list { overflow-y: auto; padding: 0 10px 16px; display: flex; flex-direction: column; gap: 2px; }
    .job-group { display: flex; flex-direction: column; gap: 3px; margin-top: 7px; }
    .group-head {
      display: flex;
      align-items: center;
      gap: 7px;
      width: 100%;
      padding: 5px 7px;
      border: 0;
      border-radius: 6px;
      background: transparent;
      color: var(--muted);
      text-align: left;
      cursor: pointer;
      font: 10px var(--mono);
    }
    .group-head:hover { background: rgba(255,255,255,.03); color: var(--text); }
    .group-caret { width: 9px; color: var(--faint); }
    .group-name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .group-count { color: var(--faint); }
    .group-jobs { display: flex; flex-direction: column; gap: 3px; margin-left: 6px; padding-left: 5px; border-left: 1px solid var(--border); }
    .group-jobs[hidden] { display: none; }
    .job-item {
      width: 100%;
      padding: 11px 11px 10px;
      border: 1px solid transparent;
      border-radius: 10px;
      background: transparent;
      color: var(--text);
      text-align: left;
      cursor: pointer;
      transition: background .12s ease, border-color .12s ease;
    }
    .job-item:hover { background: rgba(255,255,255,.035); }
    .job-item.selected { background: var(--panel-2); border-color: var(--border); }
    .job-item-top { display: flex; align-items: center; gap: 8px; min-width: 0; }
    .status-dot { flex: 0 0 auto; width: 7px; height: 7px; border-radius: 50%; background: var(--faint); }
    .status-dot.running, .status-dot.starting { background: var(--accent); box-shadow: 0 0 8px color-mix(in srgb, var(--accent) 75%, transparent); }
    .status-dot.queued { background: var(--warn); }
    .status-dot.succeeded { background: var(--ok); }
    .status-dot.failed, .status-dot.timed_out, .status-dot.interrupted { background: var(--error); }
    .status-dot.cancelled { background: var(--muted); }
    .job-label { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; font-weight: 600; font-size: 13px; }
    .job-status { flex: 0 0 auto; color: var(--muted); font: 10px var(--mono); text-transform: uppercase; letter-spacing: .04em; }
    .job-sub { display: flex; gap: 9px; margin-top: 6px; padding-left: 15px; color: var(--faint); font: 10px var(--mono); }
    .job-sub span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .job-sub .grow { flex: 1; }
    .content { min-width: 0; min-height: 0; overflow: hidden; }
    .empty {
      display: grid;
      place-items: center;
      height: 100%;
      padding: 32px;
      color: var(--muted);
      text-align: center;
    }
    .empty-card { max-width: 440px; }
    .empty-icon {
      display: grid;
      place-items: center;
      width: 58px;
      height: 58px;
      margin: 0 auto 16px;
      border: 1px solid var(--border);
      border-radius: 16px;
      background: var(--panel);
      color: var(--accent);
      font: 21px var(--mono);
    }
    .empty h3 { margin: 0 0 7px; color: var(--text); font-size: 17px; }
    .empty p { margin: 0; line-height: 1.55; }
    .job-view { display: flex; flex-direction: column; height: 100%; min-height: 0; }
    .job-head { padding: 20px 24px 15px; border-bottom: 1px solid var(--border); }
    .job-title-row { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; }
    .job-title-wrap { min-width: 0; }
    .job-title { margin: 0; font-size: 22px; letter-spacing: -0.035em; line-height: 1.2; }
    .job-id-row { display: flex; align-items: center; flex-wrap: wrap; gap: 8px; margin-top: 7px; color: var(--muted); font: 11px var(--mono); }
    .copy {
      border: 0;
      padding: 1px 5px;
      border-radius: 5px;
      background: var(--panel-2);
      color: var(--muted);
      cursor: pointer;
      font: 10px var(--mono);
    }
    .copy:hover { color: var(--text); }
    .status-pill {
      flex: 0 0 auto;
      padding: 6px 10px;
      border: 1px solid var(--border);
      border-radius: 999px;
      color: var(--muted);
      background: var(--panel-2);
      font: 10px var(--mono);
      text-transform: uppercase;
      letter-spacing: .06em;
    }
    .status-pill.running, .status-pill.starting { color: var(--accent); border-color: color-mix(in srgb, var(--accent) 40%, var(--border)); }
    .status-pill.succeeded { color: var(--ok); border-color: color-mix(in srgb, var(--ok) 38%, var(--border)); }
    .status-pill.failed, .status-pill.timed_out, .status-pill.interrupted { color: var(--error); border-color: color-mix(in srgb, var(--error) 38%, var(--border)); }
    .status-pill.queued { color: var(--warn); }
    .job-actions { display: flex; align-items: center; flex: 0 0 auto; gap: 8px; }
    .delete-btn {
      padding: 6px 10px;
      border: 1px solid color-mix(in srgb, var(--error) 35%, var(--border));
      border-radius: 8px;
      background: transparent;
      color: var(--error);
      cursor: pointer;
      font: 10px var(--mono);
    }
    .delete-btn:hover:not(:disabled) { background: color-mix(in srgb, var(--error) 12%, transparent); }
    .delete-btn:disabled { color: var(--faint); border-color: var(--border); cursor: not-allowed; }
    .meta { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 15px; }
    .meta-item {
      display: flex;
      align-items: baseline;
      gap: 6px;
      max-width: 100%;
      padding: 5px 8px;
      border: 1px solid var(--border);
      border-radius: 7px;
      background: rgba(255,255,255,.018);
      color: var(--muted);
      font: 10px var(--mono);
    }
    .meta-item b { color: var(--text); font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .toolbar {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 14px;
      padding: 11px 24px;
      border-bottom: 1px solid var(--border);
      color: var(--muted);
      font-size: 11px;
    }
    .toolbar-title { margin-right: auto; color: var(--text); font-weight: 600; }
    .toggle { display: inline-flex; align-items: center; gap: 5px; cursor: pointer; user-select: none; }
    .toggle input { accent-color: var(--accent); margin: 0; }
    .timeline { flex: 1; min-height: 0; overflow-y: auto; padding: 18px 24px 60px; scroll-behavior: smooth; }
    .event {
      position: relative;
      margin-left: 10px;
      padding: 0 0 15px 21px;
      border-left: 1px solid var(--border);
    }
    .event:last-child { border-left-color: transparent; }
    .event-marker {
      position: absolute;
      left: -5px;
      top: 3px;
      display: grid;
      place-items: center;
      width: 9px;
      height: 9px;
      border: 2px solid var(--bg);
      border-radius: 50%;
      background: var(--faint);
    }
    .event.tool_call .event-marker { background: var(--accent); }
    .event.tool_result .event-marker { background: var(--accent-2); }
    .event.status .event-marker { background: var(--faint); }
    .event.text .event-marker { background: var(--text); }
    .event.thinking .event-marker { background: var(--warn); }
    .event.final .event-marker { background: var(--ok); box-shadow: 0 0 8px color-mix(in srgb, var(--ok) 65%, transparent); }
    .event.error .event-marker { background: var(--error); }
    .event-head { display: flex; align-items: baseline; flex-wrap: wrap; gap: 7px; min-height: 18px; }
    .event-kind {
      color: var(--faint);
      font: 9px var(--mono);
      text-transform: uppercase;
      letter-spacing: .08em;
    }
    .event-title { color: var(--text); font-size: 12px; font-weight: 600; }
    .event-note { color: var(--muted); font: 10px var(--mono); }
    .event-body { margin-top: 6px; }
    .event pre {
      max-height: 360px;
      margin: 0;
      overflow: auto;
      padding: 10px 12px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: #0b0e14;
      color: #d8deea;
      font: 11px/1.55 var(--mono);
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }
    .event details { margin: 0; }
    .event summary {
      width: fit-content;
      cursor: pointer;
      color: var(--muted);
      font: 10px var(--mono);
      user-select: none;
    }
    .event summary:hover { color: var(--text); }
    .event details pre { margin-top: 6px; }
    .event.text .event-body pre, .event.final .event-body pre {
      border-color: #2c3548;
      background: #10151f;
      color: var(--text);
      font-family: var(--sans);
      font-size: 12px;
      line-height: 1.6;
    }
    .event.final .event-body pre { border-color: color-mix(in srgb, var(--ok) 35%, var(--border)); }
    .badge { padding: 1px 5px; border-radius: 5px; background: var(--panel-2); color: var(--muted); font: 9px var(--mono); }
    .badge.error { color: var(--error); }
    .badge.ok { color: var(--ok); }
    .badge.warn { color: var(--warn); }
    .truncated { margin-top: 5px; color: var(--warn); font: 10px var(--mono); }
    .no-events { padding: 40px 0; color: var(--muted); text-align: center; font-size: 12px; }
    ::-webkit-scrollbar { width: 9px; height: 9px; }
    ::-webkit-scrollbar-thumb { background: #2b3344; border-radius: 999px; border: 2px solid transparent; background-clip: padding-box; }
    ::-webkit-scrollbar-track { background: transparent; }
    @media (max-width: 820px) {
      body { overflow: auto; }
      .app { min-height: 100vh; height: auto; }
      .layout { grid-template-columns: 1fr; }
      .sidebar { max-height: 240px; border-right: 0; border-bottom: 1px solid var(--border); }
      .content { min-height: 70vh; }
      .job-view { min-height: 70vh; }
      .topbar { padding: 12px 15px; }
      .job-head, .toolbar, .timeline { padding-left: 16px; padding-right: 16px; }
      .brand p { display: none; }
    }
  </style>
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand">
        <div class="brand-mark">DSH</div>
        <div>
          <h1>Workers</h1>
          <p>DeepSeek Harness jobs launched through MCP</p>
        </div>
      </div>
      <div class="live" id="live"><span class="live-dot"></span><span id="live-text">connecting</span></div>
    </header>
    <div class="layout">
      <aside class="sidebar">
        <div class="sidebar-head">
          <h2>Jobs</h2>
          <div class="counts">
            <div class="count" title="active"><strong id="active-count">0</strong> live</div>
            <div class="count" title="total"><strong id="total-count">0</strong> all</div>
          </div>
        </div>
        <div class="sidebar-note" id="retention-note">Loading retention policy…</div>
        <div class="job-list" id="job-list"></div>
      </aside>
      <main class="content">
        <div class="empty" id="empty">
          <div class="empty-card">
            <div class="empty-icon">⌁</div>
            <h3>Waiting for a worker</h3>
            <p>Start a DSH job from Claude, then this dashboard will show its steps, tools, text, and final result live.</p>
          </div>
        </div>
        <section class="job-view" id="job-view" hidden>
          <div class="job-head">
            <div class="job-title-row">
              <div class="job-title-wrap">
                <h2 class="job-title" id="job-title">Selected job</h2>
                <div class="job-id-row"><span id="job-id"></span><button class="copy" id="copy-id" type="button">copy</button></div>
              </div>
              <div class="job-actions">
                <span class="status-pill" id="job-status"></span>
                <button class="delete-btn" id="delete-job" type="button" title="Delete this job">Delete</button>
              </div>
            </div>
            <div class="meta" id="job-meta"></div>
          </div>
          <div class="toolbar">
            <span class="toolbar-title">Timeline</span>
            <label class="toggle"><input type="checkbox" id="show-tools" checked> tools</label>
            <label class="toggle"><input type="checkbox" id="show-thinking" checked> thinking</label>
            <label class="toggle"><input type="checkbox" id="show-text" checked> text</label>
            <label class="toggle"><input type="checkbox" id="auto-scroll" checked> auto-scroll</label>
          </div>
          <div class="timeline" id="timeline"></div>
        </section>
      </main>
    </div>
  </div>
  <script>
    'use strict';

    const state = {
      jobs: [],
      selected: null,
      events: [],
      seen: new Set(),
      source: null,
      connected: false,
      autoSelectDone: false,
      retentionDays: 0,
      collapsedGroups: new Set(),
    };

    const $ = (id) => document.getElementById(id);
    const jobList = $('job-list');
    const timeline = $('timeline');
    const empty = $('empty');
    const jobView = $('job-view');
    const live = $('live');
    const liveText = $('live-text');

    function el(tag, className, text) {
      const node = document.createElement(tag);
      if (className) node.className = className;
      if (text !== undefined && text !== null) node.textContent = String(text);
      return node;
    }

    function safeStatus(status) {
      return ['queued', 'starting', 'running', 'succeeded', 'failed', 'timed_out', 'cancelled', 'interrupted'].includes(status)
        ? status
        : 'unknown';
    }

    function activeStatus(status) {
      return status === 'queued' || status === 'starting' || status === 'running';
    }

    function selectedJob() {
      return state.jobs.find((job) => job.id === state.selected) || null;
    }

    function formatElapsed(seconds) {
      if (!Number.isFinite(seconds) || seconds < 0) return '0s';
      if (seconds < 60) return Math.round(seconds) + 's';
      const minutes = Math.floor(seconds / 60);
      const rest = Math.round(seconds % 60);
      if (minutes < 60) return minutes + 'm ' + rest + 's';
      const hours = Math.floor(minutes / 60);
      return hours + 'h ' + (minutes % 60) + 'm';
    }

    function formatTime(value) {
      if (!value) return '—';
      const date = new Date(value);
      if (Number.isNaN(date.getTime())) return '—';
      return date.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });
    }

    function totalTokens(usage) {
      if (!usage) return null;
      const total = usage.totalTokens ?? usage.total_tokens;
      if (typeof total === 'number') return total;
      const input = usage.inputTokens ?? usage.input_tokens ?? 0;
      const output = usage.outputTokens ?? usage.output_tokens ?? 0;
      const sum = (typeof input === 'number' ? input : 0) + (typeof output === 'number' ? output : 0);
      return sum > 0 ? sum : null;
    }

    function renderRetention() {
      const note = $('retention-note');
      note.textContent = state.retentionDays > 0
        ? 'Terminal jobs auto-delete after ' + state.retentionDays + 'd'
        : 'Automatic job deletion disabled';
    }

    function renderCounts() {
      const active = state.jobs.filter((job) => activeStatus(job.status)).length;
      $('active-count').textContent = String(active);
      $('total-count').textContent = String(state.jobs.length);
    }

    function groupKey(job) {
      return job.group_id || 'legacy';
    }

    function groupedJobs() {
      const groups = new Map();
      for (const job of state.jobs) {
        const key = groupKey(job);
        if (!groups.has(key)) {
          groups.set(key, {
            id: key,
            name: job.group_name || 'Legacy / ungrouped',
            jobs: [],
            active: false,
          });
        }
        const group = groups.get(key);
        group.jobs.push(job);
        group.active = group.active || activeStatus(job.status);
      }
      return [...groups.values()].sort((a, b) => {
        const activeOrder = Number(b.active) - Number(a.active);
        return activeOrder !== 0 ? activeOrder : a.name.localeCompare(b.name);
      });
    }

    function renderJobs() {
      const previousScroll = jobList.scrollTop;
      jobList.replaceChildren();
      for (const group of groupedJobs()) {
        const section = el('section', 'job-group');
        const head = el('button', 'group-head');
        head.type = 'button';
        head.title = group.id;
        const collapsed = state.collapsedGroups.has(group.id);
        head.append(el('span', 'group-caret', collapsed ? '▸' : '▾'));
        if (group.active) head.append(el('span', 'status-dot running'));
        head.append(el('span', 'group-name', group.name));
        head.append(el('span', 'group-count', String(group.jobs.length)));
        head.addEventListener('click', () => {
          if (state.collapsedGroups.has(group.id)) state.collapsedGroups.delete(group.id);
          else state.collapsedGroups.add(group.id);
          renderJobs();
        });
        section.append(head);

        const body = el('div', 'group-jobs');
        body.hidden = collapsed;
        for (const job of group.jobs) {
          const status = safeStatus(job.status);
          const button = el('button', 'job-item' + (job.id === state.selected ? ' selected' : ''));
          button.type = 'button';
          button.dataset.jobId = job.id;
          button.addEventListener('click', () => selectJob(job.id));

          const top = el('div', 'job-item-top');
          top.append(el('span', 'status-dot ' + status));
          top.append(el('span', 'job-label', job.label || job.id));
          top.append(el('span', 'job-status', status.replace('_', ' ')));
          button.append(top);

          const sub = el('div', 'job-sub');
          sub.append(el('span', '', job.steps + ' steps'));
          sub.append(el('span', '', job.tool_calls + ' tools'));
          sub.append(el('span', 'grow', formatElapsed(job.elapsed_s)));
          button.append(sub);
          body.append(button);
        }
        section.append(body);
        jobList.append(section);
      }
      jobList.scrollTop = previousScroll;
      renderCounts();
    }

    function addMeta(label, value, title) {
      if (value === undefined || value === null || value === '') return;
      const item = el('span', 'meta-item');
      item.append(el('span', '', label));
      item.append(el('b', '', value));
      if (title) item.title = title;
      $('job-meta').append(item);
    }

    function renderJobHeader() {
      const job = selectedJob();
      if (!job) {
        empty.hidden = false;
        jobView.hidden = true;
        return;
      }
      empty.hidden = true;
      jobView.hidden = false;
      $('job-title').textContent = job.label || job.id;
      $('job-id').textContent = job.id;
      const status = safeStatus(job.status);
      const pill = $('job-status');
      pill.className = 'status-pill ' + status;
      pill.textContent = job.reason ? status + ' · ' + job.reason : status.replace('_', ' ');
      $('job-meta').replaceChildren();
      addMeta('cwd', job.cwd, job.cwd);
      addMeta('elapsed', formatElapsed(job.elapsed_s));
      addMeta('steps', String(job.steps));
      addMeta('tools', String(job.tool_calls));
      if (job.last_tool) addMeta('last tool', job.last_tool);
      if (job.access) addMeta('access', job.access);
      if (job.isolation) addMeta('isolation', job.isolation);
      if (job.session_id) addMeta('session', job.session_id.slice(0, 18), job.session_id);
      const tokens = totalTokens(job.usage);
      if (tokens !== null) addMeta('tokens', tokens.toLocaleString());
      if (job.worktree) addMeta('worktree', job.worktree.branch || job.worktree.path, job.worktree.path);
      addMeta('started', formatTime(job.started_at));
      addMeta('last event', formatTime(job.last_event_at));
      const deleteButton = $('delete-job');
      deleteButton.disabled = activeStatus(job.status);
      deleteButton.title = deleteButton.disabled
        ? 'Active jobs cannot be deleted'
        : 'Delete this job record';
    }

    function makeCard(event) {
      const type = event.type || 'unknown';
      const data = event.event || {};
      const card = el('article', 'event ' + type);
      card.append(el('span', 'event-marker'));
      const head = el('div', 'event-head');
      head.append(el('span', 'event-kind', type.replace('_', ' ')));

      const addPre = (value) => {
        const pre = el('pre', '', typeof value === 'string' ? value : JSON.stringify(value, null, 2));
        card.append(pre);
      };

      const addDetails = (label, value) => {
        const details = el('details');
        details.append(el('summary', '', label));
        const pre = el('pre', '', typeof value === 'string' ? value : JSON.stringify(value, null, 2));
        details.append(pre);
        card.append(details);
      };

      if (event.truncated) {
        head.append(el('span', 'badge warn', 'truncated'));
        head.append(el('span', 'event-note', event.bytes + ' bytes'));
        card.append(head);
        addPre(event.preview || '');
        return card;
      }
      if (event.parse_error) {
        head.append(el('span', 'badge error', event.parse_error));
        card.append(head);
        addPre(event.preview || '');
        return card;
      }

      if (type === 'session') {
        head.append(el('span', 'event-title', 'session started'));
        head.append(el('span', 'event-note', data.cwd || ''));
        card.append(head);
        if (data.sessionId) addPre('session ' + data.sessionId);
      } else if (type === 'status') {
        const phase = data.phase || 'status';
        let title = phase.replace('_', ' ');
        let note = '';
        if (phase === 'step_start') {
          title = 'step ' + data.step + ' started';
          note = 'turn ' + data.turn;
        } else if (phase === 'step_end') {
          title = 'step ' + data.step + ' finished';
          note = data.usage ? 'usage ' + JSON.stringify(data.usage) : '';
        } else if (phase === 'turn_end') {
          const reason = data.reason;
          title = 'turn finished';
          note = typeof reason === 'string' ? reason : reason?.kind || '';
        } else if (phase === 'turn_start') {
          title = 'turn ' + data.turn + ' started';
        }
        head.append(el('span', 'event-title', title));
        if (note) head.append(el('span', 'event-note', note));
        card.append(head);
      } else if (type === 'tool_call') {
        head.append(el('span', 'event-title', data.tool || 'tool'));
        head.append(el('span', 'event-note', data.callId || ''));
        card.append(head);
        if (data.input !== undefined) addDetails('input', data.input);
      } else if (type === 'tool_result') {
        head.append(el('span', 'event-title', 'tool result'));
        const ok = data.status === 'completed';
        head.append(el('span', 'badge ' + (ok ? 'ok' : 'error'), data.status || 'result'));
        head.append(el('span', 'event-note', data.callId || ''));
        card.append(head);
        if (data.result !== undefined) addDetails('output', data.result);
      } else if (type === 'thinking') {
        head.append(el('span', 'event-title', 'thinking'));
        card.append(head);
        addDetails('reasoning', data.text || '');
      } else if (type === 'text') {
        head.append(el('span', 'event-title', 'assistant text'));
        card.append(head);
        addPre(data.text || '');
      } else if (type === 'final') {
        head.append(el('span', 'event-title', 'final result'));
        card.append(head);
        addPre(data.text || '');
      } else if (type === 'error') {
        head.append(el('span', 'event-title', 'error'));
        card.append(head);
        addPre(data.message || data.code || data);
      } else {
        head.append(el('span', 'event-title', type));
        card.append(head);
        addDetails('event', data);
      }
      return card;
    }

    function renderTimeline() {
      const showTools = $('show-tools').checked;
      const showThinking = $('show-thinking').checked;
      const showText = $('show-text').checked;
      timeline.replaceChildren();
      const filtered = state.events.filter((event) => {
        if (event.type === 'tool_call' || event.type === 'tool_result') return showTools;
        if (event.type === 'thinking') return showThinking;
        if (event.type === 'text' || event.type === 'final') return showText;
        return true;
      });
      if (filtered.length === 0) {
        timeline.append(el('div', 'no-events', 'Waiting for events…'));
        return;
      }
      const fragment = document.createDocumentFragment();
      for (const event of filtered) fragment.append(makeCard(event));
      timeline.append(fragment);
      if ($('auto-scroll').checked) {
        requestAnimationFrame(() => {
          timeline.scrollTop = timeline.scrollHeight;
        });
      }
    }

    function selectJob(jobId) {
      if (!jobId) return;
      if (state.selected === jobId && state.source) {
        renderJobHeader();
        return;
      }
      const selected = state.jobs.find((job) => job.id === jobId);
      if (selected) state.collapsedGroups.delete(groupKey(selected));
      state.selected = jobId;
      state.events = [];
      state.seen.clear();
      history.replaceState(null, '', '#' + encodeURIComponent(jobId));
      renderJobs();
      renderJobHeader();
      renderTimeline();
      connect();
    }

    function chooseDefaultJob() {
      if (state.autoSelectDone || state.selected) return;
      const hash = decodeURIComponent(location.hash.slice(1));
      const target = (hash && state.jobs.find((job) => job.id === hash))
        || state.jobs.find((job) => activeStatus(job.status))
        || state.jobs[0];
      if (!target) return;
      state.autoSelectDone = true;
      setTimeout(() => selectJob(target.id), 0);
    }

    function setLive(online) {
      state.connected = online;
      live.classList.toggle('online', online);
      live.classList.toggle('offline', !online);
      liveText.textContent = online ? 'live' : 'disconnected';
    }

    function connect() {
      if (state.source) state.source.close();
      const params = new URLSearchParams();
      if (state.selected) {
        params.set('job_id', state.selected);
        params.set('cursor', '0');
      }
      const source = new EventSource('/api/stream?' + params.toString());
      state.source = source;
      source.onopen = () => setLive(true);
      source.onerror = () => setLive(false);
      source.addEventListener('jobs', (message) => {
        const payload = JSON.parse(message.data);
        state.jobs = Array.isArray(payload.jobs) ? payload.jobs : [];
        state.retentionDays = Number(payload.server?.retention_days) || 0;
        renderRetention();
        renderJobs();
        renderJobHeader();
        chooseDefaultJob();
      });
      source.addEventListener('events', (message) => {
        const payload = JSON.parse(message.data);
        let added = false;
        for (const event of payload.events || []) {
          if (state.seen.has(event.cursor)) continue;
          state.seen.add(event.cursor);
          state.events.push(event);
          added = true;
        }
        state.events.sort((a, b) => a.cursor - b.cursor);
        if (added) renderTimeline();
      });
      source.addEventListener('reset', () => {
        state.events = [];
        state.seen.clear();
        renderTimeline();
      });
      source.addEventListener('stream_error', () => setLive(false));
    }

    async function deleteSelectedJob(discardChanges) {
      const job = selectedJob();
      if (!job) return;
      if (activeStatus(job.status)) {
        alert('Active jobs cannot be deleted.');
        return;
      }
      if (!discardChanges) {
        const message = job.worktree
          ? 'Delete job ' + job.id + '?\n\nA clean worktree will be removed. Dirty changes are preserved unless you confirm again.'
          : 'Delete job ' + job.id + ' and its logs?';
        if (!confirm(message)) return;
      }
      let response;
      try {
        response = await fetch(
          '/api/jobs/' + encodeURIComponent(job.id) + '?discard_changes=' + (discardChanges ? '1' : '0'),
          { method: 'DELETE' },
        );
      } catch (err) {
        alert('Delete failed: ' + err);
        return;
      }
      let body = {};
      try { body = await response.json(); } catch { /* keep empty body */ }
      if (response.status === 409 && body.error === 'worktree_dirty') {
        if (confirm('The worktree has uncommitted changes. Delete the job and discard those changes?')) {
          await deleteSelectedJob(true);
        }
        return;
      }
      if (!response.ok) {
        alert(body.message || ('Delete failed with HTTP ' + response.status));
        return;
      }
      state.jobs = state.jobs.filter((item) => item.id !== job.id);
      state.selected = null;
      state.events = [];
      state.seen.clear();
      state.autoSelectDone = false;
      history.replaceState(null, '', location.pathname);
      renderJobs();
      renderJobHeader();
      renderTimeline();
      connect();
    }

    $('copy-id').addEventListener('click', async () => {
      if (!state.selected) return;
      try {
        await navigator.clipboard.writeText(state.selected);
        $('copy-id').textContent = 'copied';
        setTimeout(() => { $('copy-id').textContent = 'copy'; }, 1200);
      } catch {
        $('copy-id').textContent = 'failed';
      }
    });
    $('delete-job').addEventListener('click', () => void deleteSelectedJob(false));

    for (const id of ['show-tools', 'show-thinking', 'show-text']) {
      $(id).addEventListener('change', renderTimeline);
    }
    window.addEventListener('hashchange', () => {
      const hash = decodeURIComponent(location.hash.slice(1));
      if (hash && state.jobs.some((job) => job.id === hash)) selectJob(hash);
    });

    connect();
  </script>
</body>
</html>
